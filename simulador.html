<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pluma — Simulador móvil</title>
<style>
  :root {
    --fondo: #14161c;
    --fondo2: #1c1f27;
    --texto: #e8eaf0;
    --tenue: #9aa2b4;
    --linea: rgba(255,255,255,0.12);
    --tinta: #6b7cf0;
    --marigold: #f2a93b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: radial-gradient(1200px 700px at 20% -10%, #232735, var(--fondo));
    color: var(--texto);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 12px 18px;
    border-bottom: 1px solid var(--linea);
  }
  h1 { margin: 0; font-size: 15px; letter-spacing: -0.2px; white-space: nowrap; }
  .chip {
    background: var(--fondo2); border: 1px solid var(--linea);
    border-radius: 999px; padding: 4px 11px; font-size: 12px;
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  .chip b { color: var(--marigold); font-weight: 600; }
  .crece { flex: 1 1 auto; }

  nav {
    flex: 0 0 auto;
    display: flex; gap: 6px; padding: 10px 18px;
    overflow-x: auto; scrollbar-width: thin;
    border-bottom: 1px solid var(--linea);
  }
  nav button {
    background: var(--fondo2); color: var(--texto);
    border: 1px solid var(--linea); border-radius: 999px;
    padding: 6px 13px; font-size: 12.5px; cursor: pointer; white-space: nowrap;
    transition: background .15s, border-color .15s;
  }
  nav button:hover { background: #262a35; }
  nav button[aria-current="true"] { background: var(--tinta); border-color: var(--tinta); color: #fff; }

  /* Escenario: el teléfono se escala para caber SIEMPRE, sin importar el zoom
     del navegador ni el tamaño de la ventana. */
  .escena {
    flex: 1 1 auto;
    display: grid;
    place-items: center;
    min-height: 0;
    padding: 14px;
  }
  .encaje { transform-origin: center center; }

  .telefono {
    position: relative;
    width: 401px; height: 838px;
    background: #0a0b0e;
    border-radius: 54px;
    padding: 13px;
    box-shadow: 0 0 0 2px #2a2e39, 0 30px 70px rgba(0,0,0,0.55);
  }
  .pantalla {
    position: relative;
    width: 375px; height: 812px;
    border-radius: 42px;
    overflow: hidden;
    background: #f2f4f7;
  }
  .pantalla iframe { width: 375px; height: 812px; border: 0; display: block; }
  .muesca {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 148px; height: 27px; background: #0a0b0e;
    border-bottom-left-radius: 16px; border-bottom-right-radius: 16px;
    z-index: 5; pointer-events: none;
  }
  .gesto {
    position: absolute; bottom: 7px; left: 50%; transform: translateX(-50%);
    width: 128px; height: 4px; border-radius: 2px;
    background: rgba(20,24,33,0.28); z-index: 5; pointer-events: none;
  }

  .pie {
    flex: 0 0 auto;
    padding: 8px 18px 12px;
    font-size: 12px; color: var(--tenue);
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
    border-top: 1px solid var(--linea);
  }
  .escala { font-family: ui-monospace, Consolas, monospace; color: var(--texto); }
  .caido {
    display: none; margin-left: auto;
    color: #f3c2cb;
  }
</style>
</head>
<body>

<header>
  <h1>Pluma — simulador móvil</h1>
  <span class="chip">correo <b>ana@demo.gt</b></span>
  <span class="chip">clave <b>Quetzal2026seguro</b></span>
  <span class="crece"></span>
  <span class="chip" id="estado">conectando…</span>
</header>

<nav id="rutas"></nav>

<div class="escena">
  <div class="encaje" id="encaje">
    <div class="telefono">
      <div class="muesca"></div>
      <div class="pantalla">
        <iframe id="app" src="http://localhost:8081/bienvenida" title="Pluma"></iframe>
      </div>
      <div class="gesto"></div>
    </div>
  </div>
</div>

<div class="pie">
  <span>Pantalla real de 375×812. Escala automática: <span class="escala" id="pct">100%</span></span>
  <span>·</span>
  <span>No hace falta el modo dispositivo del navegador. Si lo tenés activo, apagalo.</span>
  <span class="caido" id="caido">No se pudo cargar localhost:8081 — levantá <code>npx expo start</code>.</span>
</div>

<script>
  const BASE = 'http://localhost:8081';

  const RUTAS = [
    ['Bienvenida', '/bienvenida'],
    ['Crear cuenta', '/crear-cuenta'],
    ['Entrar', '/entrar'],
    ['Inicio', '/'],
    ['Cambiar', '/cambiar'],
    ['Comprar', '/comprar'],
    ['Enviar', '/enviar'],
    ['Recibir', '/recibir'],
    ['Actividad', '/actividad'],
    ['Aprender', '/aprender'],
    ['Ajustes', '/ajustes'],
  ];

  const nav = document.getElementById('rutas');
  const marco = document.getElementById('app');

  RUTAS.forEach(([nombre, ruta], i) => {
    const b = document.createElement('button');
    b.textContent = nombre;
    b.setAttribute('aria-current', i === 0 ? 'true' : 'false');
    b.addEventListener('click', () => {
      marco.src = BASE + ruta;
      nav.querySelectorAll('button').forEach((x) => x.setAttribute('aria-current', 'false'));
      b.setAttribute('aria-current', 'true');
    });
    nav.appendChild(b);
  });

  /**
   * Encaje automático.
   *
   * El teléfono mide 401×838 fijos. En vez de pedirle a la persona que ajuste
   * el zoom del navegador, se escala para caber en el espacio disponible — así
   * se ve completo con cualquier zoom, ventana o pantalla.
   */
  const ALTO = 838, ANCHO = 401;
  const encaje = document.getElementById('encaje');
  const escena = document.querySelector('.escena');
  const pct = document.getElementById('pct');

  function ajustar() {
    const dispW = escena.clientWidth - 28;
    const dispH = escena.clientHeight - 28;
    // Nunca agranda por encima de 1: a tamaño real ya es fiel al teléfono.
    const escala = Math.min(dispW / ANCHO, dispH / ALTO, 1);
    encaje.style.transform = `scale(${escala})`;
    pct.textContent = Math.round(escala * 100) + '%';
  }

  new ResizeObserver(ajustar).observe(escena);
  window.addEventListener('resize', ajustar);
  ajustar();

  // Estado del servidor de la app.
  fetch(BASE, { mode: 'no-cors' })
    .then(() => { document.getElementById('estado').textContent = 'app conectada'; })
    .catch(() => {
      document.getElementById('estado').textContent = 'app caída';
      document.getElementById('caido').style.display = 'block';
    });
</script>

</body>
</html>
